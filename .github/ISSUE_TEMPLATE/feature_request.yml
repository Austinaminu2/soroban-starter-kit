name: Feature Request
description: Suggest an improvement or new capability for the Soroban Starter Kit
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Help us understand the motivation and what success looks like.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve, or what need does it address?
      placeholder: As a developer using this kit, I want to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the change or addition you'd like to see.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this feature is complete? List observable outcomes.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches or workarounds you have considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, references, or screenshots that support this request.
    validations:
      required: false
