name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@bea2613671fdc92bb01f08d92f00220eadfd19257 # v4
        with:
          node-version: "20"

      - name: Check for changesets
        run: |
          if [ -z "$(ls -A .changeset/*.md 2>/dev/null | grep -v README)" ]; then
            echo "::warning::No changesets found in .changeset/"
            exit 0
          fi
          echo "Changesets found - ready to process"

  release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@bea2613671fdc92bb01f08d92f00220eadfd19257 # v4
        with:
          node-version: "20"

      - name: Create Release Pull Request
        uses: changesets/action@3163cf0d8c919629320f9557e2de4f7af60b6111 # v1
        with:
          publish: false
          title: "chore: release version bumps"
          commit: "chore: release version bumps"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/main'
      )
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Build all contracts (release)
        run: |
          for dir in contracts/*/; do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "Building $(basename $dir)..."
              stellar contract build --manifest-path "$dir/Cargo.toml"
            fi
          done

      - name: Calculate SHA256 checksums
        run: |
          cd target/wasm32-unknown-unknown/release
          sha256sum *.wasm > checksums.sha256
          cat checksums.sha256

      # ------------------------------------------------------------------
      # Reproducible build verification — Issue #1215
      #
      # Build WASMs inside the reproducible Docker container and compare
      # their SHA-256 hashes against the hashes produced by the standard
      # release build above. A mismatch means the Dockerfile.reproducible
      # is out of sync with the release build environment and must be fixed
      # before the release is published.
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac2b4d3e82e63eaf394cd4fcf # v3

      - name: Build reproducible Docker image
        run: |
          GIT_COMMIT_EPOCH=$(git log -1 --format="%ct")
          docker build \
            --build-arg "GIT_COMMIT_EPOCH=${GIT_COMMIT_EPOCH}" \
            --no-cache \
            -f docker/Dockerfile.reproducible \
            -t soroban-reproducible:ci \
            .

      - name: Verify reproducible build matches release checksums
        run: |
          mkdir -p reproducible-wasm
          docker run --rm \
            -v "$PWD/reproducible-wasm:/out" \
            soroban-reproducible:ci \
            sh -c "cp /wasm/*.wasm /out/ && cp /wasm/checksums.sha256 /out/reproducible-checksums.sha256"

          echo "=== Reproducible build checksums ==="
          cat reproducible-wasm/reproducible-checksums.sha256

          echo "=== Release build checksums ==="
          cat target/wasm32-unknown-unknown/release/checksums.sha256

          # Compare: every hash in the release checksums must appear in the
          # reproducible checksums with the same value.
          MISMATCH=0
          while IFS= read -r line; do
            REF_HASH=$(echo "$line" | awk '{print $1}')
            FILENAME=$(echo "$line" | awk '{print $2}' | sed 's|^\./||')
            REPRO_HASH=$(grep -F "$FILENAME" reproducible-wasm/reproducible-checksums.sha256 | awk '{print $1}' || true)
            if [ "$REF_HASH" = "$REPRO_HASH" ]; then
              echo "  ✓ $FILENAME"
            else
              echo "  ✗ $FILENAME"
              echo "    Release:      $REF_HASH"
              echo "    Reproducible: ${REPRO_HASH:-<not found>}"
              MISMATCH=$((MISMATCH + 1))
            fi
          done < target/wasm32-unknown-unknown/release/checksums.sha256

          if [ "$MISMATCH" -gt 0 ]; then
            echo "::error::$MISMATCH WASM(s) do not reproduce. Update docker/Dockerfile.reproducible to match the release build environment."
            exit 1
          fi
          echo "All WASMs reproduced successfully."

      - name: Upload reproducible build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducible-wasm
          path: reproducible-wasm/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            target/wasm32-unknown-unknown/release/*.wasm
            target/wasm32-unknown-unknown/release/checksums.sha256
          generate_release_notes: true

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "Note: Crate publishing requires CARGO_REGISTRY_TOKEN to be configured in repository secrets"
          # Uncomment after configuring the secret:
          # cargo publish --token "$CARGO_REGISTRY_TOKEN"
