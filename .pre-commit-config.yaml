repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: machete
        name: cargo machete
        entry: cargo machete
        language: system
        # Run when any Cargo manifest changes so unused [dependencies] entries
        # are caught before they reach CI.
        files: (^|/)Cargo\.toml$
        pass_filenames: false

      - id: pin-github-actions
        name: pin GitHub Actions to commit SHAs
        description: Ensure every `uses:` in .github/workflows/*.yml is pinned to a full 40-char commit SHA.
        entry: python3 .github/scripts/check_pinned_actions.py
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false