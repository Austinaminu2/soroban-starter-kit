[package]
name = "wrapped-token"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish = false

[features]
# Ships by default (see docs/deployment-guide.md, "Cargo Feature Defaults").
default = ["pausable"]
pausable = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
soroban-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[lints]
workspace = true
