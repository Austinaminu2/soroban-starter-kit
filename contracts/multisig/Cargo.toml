[package]
name = "soroban-multisig-template"
version = "0.1.0"
edition = "2024"
authors.workspace = true
description = "A production-ready Soroban N-of-M multisig wallet contract template"
license.workspace = true

[features]
# Neither flag currently guards any code in this crate (no pause/upgrade
# entry points exist yet) — they are reserved for parity with the other
# contracts. Defaulted on so they take effect automatically once implemented;
# enabling/disabling either today has no effect on the compiled WASM. See
# docs/deployment-guide.md, "Cargo Feature Defaults".
default = ["pausable", "upgradeable"]
pausable = []
upgradeable = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
soroban-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }

[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"
doc = false

[lints]
workspace = true
