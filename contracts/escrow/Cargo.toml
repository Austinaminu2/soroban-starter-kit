[package]
name = "soroban-escrow-template"
version = "0.1.0"
edition = "2024"
authors.workspace = true
description = "A production-ready Soroban escrow contract template"
license.workspace = true

[features]
# `pausable` gates pause()/unpause() and the propose_upgrade()/execute_upgrade()
# timelock pair, and ships by default (see docs/deployment-guide.md, "Cargo
# Feature Defaults"). `upgradeable` is declared for parity with the other
# contracts but currently guards no production code in this crate — it is
# left out of `default` since enabling it has no effect.
default = ["pausable"]
pausable = []
upgradeable = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
soroban-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }


[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"
doc = false

[lints]
workspace = true

# Uncomment to use a local or forked version of soroban-sdk for development
# [patch.crates-io]
# soroban-sdk = { path = "/path/to/local/soroban-sdk" }
# soroban-sdk = { git = "https://github.com/your-fork/soroban-sdk", branch = "your-branch" }