[package]
name = "soroban-integration-tests"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
soroban-escrow-template = { path = "../contracts/escrow" }
soroban-token-template = { path = "../contracts/token" }
soroban-marketplace-template = { path = "../contracts/marketplace" }
soroban-nft-template = { path = "../contracts/nft" }
soroban-auction-template = { path = "../contracts/auction" }
soroban-lottery-template = { path = "../contracts/lottery" }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
